title: Pizza
description: Doughs, pies and a calculator that scales every batch. Groovy.

# Random quote under the tagline on the landing page (from _data/quotes.yml).
show_quotes: false

# Served from the custom domain pizza.boomstick.cc (see CNAME), so no baseurl.
# For a project site without a custom domain (username.github.io/pies) set this to "/pies".
# For a user site or custom domain leave it empty.
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM

collections:
  recipes:
    output: true
    permalink: /recipes/:name/

defaults:
  - scope:
      path: ""
      type: recipes
    values:
      layout: recipe

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
