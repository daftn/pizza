<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.intro }}">
  <script>
    // Apply the saved theme before first paint so there's no flash.
    try {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home">
      <span aria-hidden="true">🍕</span><span class="logo-plus" aria-hidden="true">+</span><svg class="logo-bench" viewBox="0 0 32 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M7 13V7.5Q16 0 25 7.5V13" stroke-width="2.2"/><path d="M11.5 5v8M16 3.8v9.2M20.5 5v8" stroke-width="1.8"/><path d="M3.5 13.5h25" stroke-width="2.8"/><path d="M7 13.5q-3 3.5 0 7.5M25 13.5q3 3.5 0 7.5" stroke-width="2.2"/></g></svg>
    </a>
    <button type="button" class="theme-toggle" aria-label="Toggle dark mode"></button>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">Be kind, rewind.</footer>
  <script>
    (function () {
      const root = document.documentElement;
      const btn = document.querySelector(".theme-toggle");
      const dark = () =>
        root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      const label = () => (btn.textContent = dark() ? "☀ Lights on" : "☾ Lights out");
      btn.addEventListener("click", () => {
        root.dataset.theme = dark() ? "light" : "dark";
        try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
        label();
      });
      label();
    })();
  </script>
</body>
</html>
