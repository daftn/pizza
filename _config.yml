title: Grindhouse Pies
description: Doughs, pies and a calculator that scales every batch. Groovy.

# Random quote under the tagline on the landing page (from _data/quotes.yml).
show_quotes: false

# For a project site (username.github.io/pizza) set this to "/pizza".
# For a user site or custom domain leave it empty.
baseurl: "/pizza"

markdown: kramdown
kramdown:
  input: GFM

collections:
  recipes:
    output: true
    permalink: /recipes/:name/

defaults:
  - scope:
      path: ""
      type: recipes
    values:
      layout: recipe

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
